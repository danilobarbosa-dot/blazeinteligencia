<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blaze Inteligência</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Montserrat, sans-serif; background: #050505; color: white; overflow-x: hidden; }

        .banner {
            width: 100%; height: 280px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)), url('https://images6.alphacoders.com/978/978181.jpg');
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            border-bottom: 2px solid #ff6b00;
        }
        .banner h1 { font-size: 55px; font-weight: 700; color: #ff6b00; text-shadow: 0 0 20px rgba(255,107,0,0.4); }
        .banner p { margin-top: 10px; font-size: 18px; color: #ddd; }

        .container { max-width: 900px; margin: auto; padding: 30px 20px; }

        .tags { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-top: -25px; margin-bottom: 30px; }
        .tag { background: #111; border: 1px solid #ff6b00; padding: 12px 20px; border-radius: 999px; font-size: 14px; transition: 0.3s; color: white; cursor: pointer; }
        .tag:hover { background: #ff6b00; transform: translateY(-2px); }

        .chat-container { background: #0d0d0d; border: 1px solid rgba(255,107,0,0.25); border-radius: 25px; padding: 25px; box-shadow: 0 0 30px rgba(255,107,0,0.12); }
        .chat-box { height: 450px; overflow-y: auto; background: #090909; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.04); margin-bottom: 20px; }
        
        .message { margin-bottom: 20px; line-height: 1.6; }
        .user { color: #ff9d4d; border-left: 3px solid #ff6b00; padding-left: 10px; }
        .bot { background: #111; padding: 15px; border-radius: 15px; margin-top: 10px; border: 1px solid #222; }
        
        .chat-img { max-width: 200px; border-radius: 10px; margin-top: 10px; border: 1px solid #ff6b00; }
        .copy-btn { margin-top: 10px; background: #ff6b00; border: none; padding: 8px 14px; border-radius: 10px; color: white; font-size: 12px; cursor: pointer; }
        
        textarea { width: 100%; height: 110px; background: #111; border: 1px solid #333; outline: none; border-radius: 18px; padding: 18px; color: white; font-size: 15px; font-family: Montserrat; resize: none; }
        input[type="file"] { margin-top: 15px; width: 100%; color: #888; }
        
        #preview { display: none; width: 120px; margin-top: 15px; border-radius: 10px; border: 2px solid #ff6b00; }
        button.send { width: 100%; margin-top: 15px; padding: 18px; border: none; border-radius: 18px; background: #ff6b00; color: white; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        button.send:hover { opacity: 0.95; transform: scale(1.01); }

        .loading { opacity: 0.7; font-style: italic; color: #ff6b00; }
    </style>
</head>
<body>

<div class="banner">
    <h1>Blaze Inteligência</h1>
    <p>Cassino • Esportes • Suporte VIP</p>
</div>

<div class="container">
    <div class="tags">
        <div class="tag">Cassino</div>
        <div class="tag">Esportes</div>
        <div class="tag">Dúvidas Frequentes</div>
    </div>

    <div class="chat-container">
        <div class="chat-box" id="chat"></div>
        <textarea id="pergunta" placeholder="Digite sua dúvida sobre a Blaze..."></textarea>
        <input type="file" id="imagem" accept="image/*" />
        <img id="preview">
        <button class="send" onclick="perguntarIA()">PERGUNTAR PARA IA</button>
    </div>
</div>

<script>
    // COLOQUE SUA CHAVE ABAIXO (A que termina em dXcXQ)
    const API_KEY = "AIzaSyDJM9vnN3s36LZ37mI17CrtWb5_T0c9XiY"; 

    // Pré-visualização da imagem
    document.getElementById("imagem").addEventListener("change", function(e){
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            const preview = document.getElementById("preview");
            preview.src = event.target.result;
            preview.style.display = "block";
        }
        reader.readAsDataURL(file);
    });

    async function perguntarIA(){
        const pInput = document.getElementById("pergunta");
        const iInput = document.getElementById("imagem");
        const chat = document.getElementById("chat");
        const preview = document.getElementById("preview");

        const pergunta = pInput.value;
        const file = iInput.files[0];

        if(!pergunta && !file) return;

        // Adiciona ao chat e limpa os campos
        let userHTML = `<div class="message user"><b>Você:</b><br>`;
        if(file) userHTML += `<img src="${URL.createObjectURL(file)}" class="chat-img"><br>`;
        if(pergunta) userHTML += `<span>${pergunta}</span>`;
        userHTML += `</div>`;
        chat.innerHTML += userHTML;

        const fileToSend = file;
        pInput.value = "";
        iInput.value = "";
        preview.style.display = "none";

        chat.innerHTML += `<div class="message bot loading" id="loading">Consultando sistema Blaze...</div>`;
        chat.scrollTop = chat.scrollHeight;

        // Montagem do conteúdo para o Gemini
        let contents = [{ parts: [] }];
        if(pergunta) contents[0].parts.push({ text: pergunta });
        
        if(fileToSend){
            const base64 = await toBase64(fileToSend);
            contents[0].parts.push({
                inlineData: { mimeType: fileToSend.type, data: base64.split(",")[1] }
            });
        }

        try {
            // URL ATUALIZADA E TESTADA
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: contents })
            });

            const data = await response.json();
            document.getElementById("loading").remove();

            if(data.error) {
                chat.innerHTML += `<div class="message bot" style="color:red">Erro: ${data.error.message}</div>`;
            } else {
                let texto = data.candidates[0].content.parts[0].text;
                const id = Date.now();
                chat.innerHTML += `
                    <div class="message bot">
                        <div id="res-${id}">${texto.replace(/\n/g, '<br>')}</div>
                        <button class="copy-btn" onclick="copiarTexto('res-${id}')">Copiar</button>
                    </div>`;
            }
        } catch (e) {
            if(document.getElementById("loading")) document.getElementById("loading").remove();
            chat.innerHTML += `<div class="message bot">Erro ao conectar com o servidor.</div>`;
        }
        chat.scrollTop = chat.scrollHeight;
    }

    function copiarTexto(id) {
        const t = document.getElementById(id).innerText;
        navigator.clipboard.writeText(t);
        alert("Copiado!");
    }

    function toBase64(file) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.readAsDataURL(file);
            r.onload = () => res(r.result);
            r.onerror = e => rej(e);
        });
    }
</script>
</body>
</html>
