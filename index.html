<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BLAZE I.A</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Montserrat;
background:#050505;
color:white;
overflow-x:hidden;
}

/* BANNER */

.banner{

width:100%;
height:300px;

background-image:
linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)),
url('https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=2070&auto=format&fit=crop');

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

border-bottom:2px solid #ff6b00;

}

.banner h1{

font-size:60px;
font-weight:700;
color:#ff6b00;

text-shadow:0 0 20px rgba(255,107,0,0.5);

}

.banner p{

margin-top:10px;
font-size:18px;
color:#ddd;

}

/* CONTAINER */

.container{

max-width:900px;
margin:auto;
padding:30px 20px;

}

/* TAGS */

.tags{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

margin-top:-25px;
margin-bottom:30px;

}

.tag{

background:#111;
border:1px solid #ff6b00;

padding:12px 20px;

border-radius:999px;

font-size:14px;

transition:0.3s;

color:white;

}

.tag:hover{

background:#ff6b00;

transform:translateY(-2px);

}

a{
text-decoration:none;
}

/* CHAT */

.chat-container{

background:#0d0d0d;

border:1px solid rgba(255,107,0,0.25);

border-radius:25px;

padding:25px;

box-shadow:
0 0 30px rgba(255,107,0,0.12);

}

.chat-box{

height:400px;

overflow-y:auto;

background:#090909;

border-radius:20px;

padding:20px;

border:1px solid rgba(255,255,255,0.04);

}

.message{

margin-bottom:20px;
line-height:1.7;

}

.user{

color:#ff9d4d;

}

.bot{

color:white;

}

textarea{

width:100%;

height:110px;

margin-top:20px;

background:#111;

border:none;

outline:none;

border-radius:18px;

padding:18px;

color:white;

font-size:15px;

font-family:Montserrat;

resize:none;

}

button{

width:100%;

margin-top:15px;

padding:18px;

border:none;

border-radius:18px;

background:#ff6b00;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:0.3s;

}

button:hover{

opacity:0.95;
transform:scale(1.01);

}

.loading{

opacity:0.7;
font-style:italic;

}

/* MOBILE */

@media(max-width:700px){

.banner{
height:220px;
}

.banner h1{
font-size:38px;
}

.banner p{
font-size:15px;
text-align:center;
padding:0 15px;
}

.chat-box{
height:350px;
}

}

</style>
</head>

<body>

<div class="banner">

<h1>BLAZE I.A</h1>

<p>
Inteligência personalizada para Cassino e Esportes
</p>

</div>

<div class="container">

<div class="tags">

<div class="tag">Cassino</div>

<div class="tag">Esportes</div>

<a
href="https://sites.google.com/blaze.bet.br/fluxodeatendimento/home"
target="_blank"
>

<div class="tag">
Calculadora Cashback
</div>

</a>

</div>

<div class="chat-container">

<div class="chat-box" id="chat">

<div class="message bot">

Olá! Sou a Blaze I.A.<br><br>

Posso ajudar com Cassino e Esportes e Dúvidas em Geral.

</div>

</div>

<textarea
id="pergunta"
placeholder="Digite sua pergunta..."
></textarea>

<button onclick="perguntarIA()">
PERGUNTAR PARA IA
</button>

</div>

</div>

<script>

const API_KEY = "AIzaSyBHku2eVGWNPuhBJAVGJ3m6Q2QZqAtSIkc";

const SYSTEM_PROMPT = `

Você é a BLAZE I.A.

Uma inteligência artificial personalizada da Blaze.

Especialidades:
- cassino
- esportes
- jogos
- dúvidas gerais

REGRAS IMPORTANTES:

- Nunca fale de outros cassinos.
- Nunca recomende concorrentes.
- Nunca use palavrões.
- Nunca xingue usuários.
- Não aceite agressividade.
- Caso o usuário xingue, responda:
"Vamos manter uma conversa respeitosa para que eu possa ajudar."

- Seja profissional.
- Seja educado.
- Explique de forma simples.
- Responda de maneira curta e objetiva.

`;

async function perguntarIA(){

const pergunta =
document.getElementById("pergunta").value;

if(!pergunta) return;

const chat =
document.getElementById("chat");

chat.innerHTML += `
<div class="message user">
<b>Você:</b><br>${pergunta}
</div>
`;

chat.innerHTML += `
<div class="message bot loading" id="loading">
BLAZE I.A está pensando...
</div>
`;

chat.scrollTop = chat.scrollHeight;

document.getElementById("pergunta").value = "";

try{

const resposta = await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[{

parts:[{

text: `
${SYSTEM_PROMPT}

Pergunta do usuário:
${pergunta}
`

}]

}]

})

}

);

const dados = await resposta.json();

document.getElementById("loading").remove();

const texto =
dados.candidates[0].content.parts[0].text;

chat.innerHTML += `
<div class="message bot">
<b>BLAZE I.A:</b><br>${texto}
</div>
`;

chat.scrollTop = chat.scrollHeight;

}catch(error){

document.getElementById("loading").remove();

chat.innerHTML += `
<div class="message bot">
Erro ao conectar com a IA.
</div>
`;

}

}

</script>

</body>
</html>
