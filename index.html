<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Montserrat;
background:#050505;
color:white;
overflow-x:hidden;

/* BANNER */

.banner{

width:100%;

<body>

<div class="banner">

<h1>Blaze Inteligência</h1>

<p>
Cassino • Esportes • Dúvidas Gerais
</p>

</div>

<div class="container">

<div class="tags">

<div class="tag">Cassino</div>

<div class="tag">Esportes</div>

<a

>

<div class="tag">
Calculadora Cashback
</div>

</a>

</div>

<div class="chat-container">

<div class="chat-box" id="chat"></div>

<textarea
id="pergunta"
placeholder="Digite sua pergunta..."
></textarea>

<button class="send" onclick="perguntarIA()">
PERGUNTAR PARA IA
</button>

</div>

</div>

<script>

const API_KEY = "COLE_SUA_NOVA_API_AQUI";

const SYSTEM_PROMPT = `

Você é uma inteligência artificial especializada em:
- cassino
- esportes
- jogos
- dúvidas gerais

REGRAS:

- Nunca fale de outros cassinos.
- Nunca recomende concorrentes.
- Nunca use palavrões.
- Nunca aceite xingamentos.
- Se o usuário xingar responda:
"Vamos manter uma conversa respeitosa para que eu possa ajudar."

- Seja profissional.
- Seja educado.
- Responda curto e objetivo.
- Explique de forma simples.

`;

async function perguntarIA(){

const pergunta =
document.getElementById("pergunta").value;

if(!pergunta) return;

const chat =
document.getElementById("chat");

chat.innerHTML += `
<div class="message user">
<b>Você:</b><br>${pergunta}
</div>
`;

chat.innerHTML += `
<div class="message bot loading" id="loading">
Pensando...
</div>
`;

chat.scrollTop = chat.scrollHeight;

document.getElementById("pergunta").value = "";

try{

const resposta = await fetch(

"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[{
parts:[{
text: `
${SYSTEM_PROMPT}

Pergunta:
${pergunta}
`
}]
}]

})

}

);

const dados = await resposta.json();

document.getElementById("loading").remove();

console.log(dados);

let texto = "Erro ao gerar resposta.";

if(
dados.candidates &&
dados.candidates[0] &&
dados.candidates[0].content &&
dados.candidates[0].content.parts &&
dados.candidates[0].content.parts[0]
){
texto =
dados.candidates[0].content.parts[0].text;
}

const id = Date.now();

chat.innerHTML += `
<div class="message bot">

<div id="resposta-${id}">
${texto}
</div>

<button
class="copy-btn"
onclick="copiarTexto('resposta-${id}')"
>
Copiar Resposta
</button>

</div>
`;

chat.scrollTop = chat.scrollHeight;

}catch(error){

document.getElementById("loading").remove();

chat.innerHTML += `
<div class="message bot">
Erro ao conectar com a IA.
</div>
`;

console.error(error);

}

}

function copiarTexto(id){

const texto =
document.getElementById(id).innerText;

navigator.clipboard.writeText(texto);

}

</script>

</body>
</html>
