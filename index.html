<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blaze Inteligência</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Montserrat;
background:#050505;
color:white;
overflow-x:hidden;
}

/* BANNER */

.banner{

width:100%;
height:280px;

background:
linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.85)),
url('https://images6.alphacoders.com/978/978181.jpg');

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;
flex-direction:column;

border-bottom:2px solid #ff6b00;

}

.banner h1{

font-size:55px;
font-weight:700;
color:#ff6b00;

text-shadow:0 0 20px rgba(255,107,0,0.4);

}

.banner p{

margin-top:10px;
font-size:18px;
color:#ddd;

}

/* CONTAINER */

.container{

max-width:900px;
margin:auto;
padding:30px 20px;

}

/* TAGS */

.tags{

display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;

margin-top:-25px;
margin-bottom:30px;

}

.tag{

background:#111;
border:1px solid #ff6b00;

padding:12px 20px;

border-radius:999px;

font-size:14px;

transition:0.3s;

color:white;

}

.tag:hover{

background:#ff6b00;
transform:translateY(-2px);

}

a{
text-decoration:none;
}

/* CHAT */

.chat-container{

background:#0d0d0d;

border:1px solid rgba(255,107,0,0.25);

border-radius:25px;

padding:25px;

box-shadow:0 0 30px rgba(255,107,0,0.12);

}

.chat-box{

height:450px;

overflow-y:auto;

background:#090909;

border-radius:20px;

padding:20px;

border:1px solid rgba(255,255,255,0.04);

margin-bottom:20px;

}

.message{

margin-bottom:20px;
line-height:1.8;

}

.user{

color:#ff9d4d;

}

.bot{

background:#111;
padding:15px;
border-radius:15px;
margin-top:10px;

}

.copy-btn{

margin-top:10px;

background:#ff6b00;

border:none;

padding:8px 14px;

border-radius:10px;

color:white;

font-size:12px;

cursor:pointer;

}

.copy-btn:hover{
opacity:0.9;
}

textarea{

width:100%;

height:110px;

background:#111;

border:none;

outline:none;

border-radius:18px;

padding:18px;

color:white;

font-size:15px;

font-family:Montserrat;

resize:none;

}

input[type="file"]{

margin-top:15px;
width:100%;
color:white;

}

#preview{

display:none;

width:100%;

margin-top:15px;

border-radius:15px;

border:1px solid rgba(255,255,255,0.08);

}

button.send{

width:100%;

margin-top:15px;

padding:18px;

border:none;

border-radius:18px;

background:#ff6b00;

color:white;

font-size:16px;

font-weight:700;

cursor:pointer;

transition:0.3s;

}

button.send:hover{

opacity:0.95;
transform:scale(1.01);

}

.loading{

opacity:0.7;
font-style:italic;

}

/* MOBILE */

@media(max-width:700px){

.banner{
height:220px;
}

.banner h1{
font-size:38px;
}

.banner p{
font-size:15px;
text-align:center;
padding:0 15px;
}

.chat-box{
height:350px;
}

}

</style>
</head>

<body>

<div class="banner">

<h1>Blaze Inteligência</h1>

<p>
Cassino • Esportes • Dúvidas Gerais
</p>

</div>

<div class="container">

<div class="tags">

<div class="tag">Cassino</div>

<div class="tag">Esportes</div>

<a
href="https://sites.google.com/blaze.bet.br/fluxodeatendimento/home"
target="_blank"
>

<div class="tag">
Calculadora Cashback
</div>

</a>

</div>

<div class="chat-container">

<div class="chat-box" id="chat"></div>

<textarea
id="pergunta"
placeholder="Digite sua pergunta..."
></textarea>

<input
type="file"
id="imagem"
accept="image/*"
/>

<img id="preview">

<button class="send" onclick="perguntarIA()">
PERGUNTAR PARA IA
</button>

</div>

</div>

<script>

const API_KEY = "AIzaSyAror8Kbwl9wVHQ3eKNtNA4Y5GOt3et9Yw";

document
.getElementById("imagem")
.addEventListener("change", function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

const preview =
document.getElementById("preview");

preview.src = event.target.result;

preview.style.display = "block";

}

reader.readAsDataURL(file);

});

async function perguntarIA(){

const pergunta =
document.getElementById("pergunta").value;

const imagemInput =
document.getElementById("imagem");

const file =
imagemInput.files[0];

const chat =
document.getElementById("chat");

if(!pergunta && !file) return;

chat.innerHTML += `
<div class="message user">
<b>Você:</b><br>${pergunta || "Imagem enviada"}
</div>
`;

chat.innerHTML += `
<div class="message bot loading" id="loading">
Analisando...
</div>
`;

chat.scrollTop = chat.scrollHeight;

let parts = [];

if(pergunta){

parts.push({
text:
`
Você é especialista em:
- esportes
- cassino
- apostas

Nunca use palavrão.
Nunca recomende concorrentes.

Analise de forma profissional.

Pergunta:
${pergunta}
`
});

}

if(file){

const base64 =
await toBase64(file);

const imageData =
base64.split(",")[1];

parts.push({

inlineData:{
mimeType:file.type,
data:imageData
}

});

}

try{

const response = await fetch(

`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,

{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

contents:[
{
parts:parts
}
],

generationConfig:{
temperature:0.7,
maxOutputTokens:700
}

})

}

);

const data = await response.json();

document.getElementById("loading").remove();

console.log(data);

if(data.error){

chat.innerHTML += `
<div class="message bot">
Erro API: ${data.error.message}
</div>
`;

return;

}

const texto =
data.candidates?.[0]?.content?.parts?.[0]?.text
|| "Sem resposta da IA.";

const id = Date.now();

chat.innerHTML += `

<div class="message bot">

<div id="resposta-${id}">
${texto}
</div>

<button
class="copy-btn"
onclick="copiarTexto('resposta-${id}')"
>
Copiar Resposta
</button>

</div>

`;

chat.scrollTop = chat.scrollHeight;

document.getElementById("pergunta").value = "";
document.getElementById("imagem").value = "";

document.getElementById("preview").style.display = "none";

}catch(error){

document.getElementById("loading").remove();

chat.innerHTML += `
<div class="message bot">
Erro ao conectar com a IA.
</div>
`;

console.error(error);

}

}

function copiarTexto(id){

const texto =
document.getElementById(id).innerText;

navigator.clipboard.writeText(texto);

}

function toBase64(file){

return new Promise((resolve,reject)=>{

const reader = new FileReader();

reader.readAsDataURL(file);

reader.onload = () => resolve(reader.result);

reader.onerror = error => reject(error);

});

}

</script>

</body>
</html>
